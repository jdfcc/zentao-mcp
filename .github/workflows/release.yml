name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    # 提到 job 级，供下方 publish 步骤的 if 条件判断是否配了 token
    # （secrets 上下文不能直接用在步骤级 if 里）
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Build successful!"

      - name: Run tests
        run: npm test

      # 自包含 skill 安装包（含 dist/ 与生产依赖），供 install.ps1 下载。
      # 必须在发版之前跑：打包失败就不该发版。
      - name: Pack skill bundle
        shell: pwsh
        run: ./scripts/pack-skill.ps1

      # 先发 Release。skill 安装包是主要分发渠道，不能因为 npm 那边出问题就一起没了
      # （步骤失败会跳过后续步骤——这正是之前「tag 推了却没有 Release」的一个潜在原因）。
      - name: Create GitHub Release and attach bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/zentao-skill.zip
            dist-release/zentao-skill.zip.sha256
          body: |
            ## 安装（推荐：skill 方式）

            一条命令完成下载 + 注册到 `~/.agents/skills/zentao` + 配置向导 + 连接自检。
            **无需注册 MCP server**，装好后任意项目目录都能用。

            ```powershell
            irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1 | iex
            ```

            重新配置凭据（升级 / 换账号）：

            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1))) -Configure
            ```

            离线或内网安装：下载下面的 `zentao-skill.zip`，然后
            `./install.ps1 -LocalZip .\zentao-skill.zip`

            ## npm 方式

            ```bash
            npx @jdfcc/zentao-mcp
            ```

            ## 校验

            安装包的 SHA256 见 `zentao-skill.zip.sha256`。
          draft: false
          prerelease: false

      # npm 是次要渠道：没配 NPM_TOKEN 就跳过；即使配了而发布失败，也不连累上面的 Release。
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
