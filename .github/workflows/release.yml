
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 检查 Git Tag 与 package.json 版本是否一致
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")

          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG 与 package.json 版本 $PKG 不一致。"
            echo "请先修改 package.json 的版本号，再重新打 Tag。"
            exit 1
          fi

          echo "[OK] Tag 与 package.json 版本一致: $PKG"

          if npm view "${NAME}@${PKG}" version >/dev/null 2>&1; then
            echo "::warning::${NAME}@${PKG} 已发布，npm 不允许覆盖相同版本。"
          else
            echo "[OK] ${NAME}@${PKG} 尚未发布"
          fi

      # 使用 Node.js 24，支持新版 npm OIDC
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 确保 npm 支持 Trusted Publishing
      - name: Update npm
        run: npm install -g npm@^11

      - name: Show versions
        run: |
          node --version
          npm --version

      # 安装依赖
      - name: Install dependencies
        run: npm ci

      # 编译 TypeScript
      - name: Build project
        run: npm run build

      # 检查编译结果
      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Build successful!"

      # 执行测试
      - name: Run tests
        run: npm test

      # 构建 Skill 安装包
      - name: Pack skill bundle
        shell: pwsh
        run: ./scripts/pack-skill.ps1

      # 创建 GitHub Release 并附加 Skill 安装包
      - name: Create GitHub Release and attach bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/zentao-skill.zip
            dist-release/zentao-skill.zip.sha256
          body: |
            ## 安装（推荐：skill 方式）

            一条命令完成下载 + 注册到 `~/.agents/skills/zentao`
            + 配置向导 + 连接自检。

            **无需注册 MCP server**，装好后任意项目目录都能用。

            ```powershell
            irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1 | iex
            ```

            重新配置凭据（升级 / 换账号）：

            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1))) -Configure
            ```

            离线或内网安装：下载下面的 `zentao-skill.zip`，然后执行：

            ```powershell
            ./install.ps1 -LocalZip .\zentao-skill.zip
            ```

            ## npm 方式

            ```bash
            npx @jdfcc/zentao-mcp
            ```

            ## 校验

            安装包的 SHA256 见 `zentao-skill.zip.sha256`。

          draft: false
          prerelease: false

      # 使用 npm Trusted Publishing (OIDC) 发布
      # 不需要 NPM_TOKEN，也不需要 NODE_AUTH_TOKEN
      - name: Publish to npm (OIDC)
        run: npm publish --access public
