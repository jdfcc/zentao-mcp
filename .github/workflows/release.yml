name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    # 提到 job 级，供下方 publish 步骤的 if 条件判断是否配了 token
    # （secrets 上下文不能直接用在步骤级 if 里）
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 发版由 tag 驱动，而 tag 是打在某个 commit 上的——不是 main 的最新提交。
      # 这条守卫拦的是「tag 落后于 main / 版本号没同步改」这类最容易犯、又最难自查的错误。
      #
      # 版本号不一致 -> 硬失败：这永远是错的，发布的是 tag 所指 commit 的内容。
      # 版本已发布过 -> 只警告：属于合法重试场景（比如 npm 发成功了、建 Release 那步挂了，
      #                 你在 Actions 页面点 "Re-run failed jobs" 会再走一遍完整流程）。
      #                 真正「忘了升版本号」的情况由上面的 tag/版本一致性检查先拦掉。
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")

          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 version $PKG 不一致。"
            echo "发布的是 tag 所指 commit 的内容。请先把版本号改成 $TAG 并提交，再重新打 tag："
            echo "  npm version $TAG --no-git-tag-version && git commit -am \"chore: release v$TAG\""
            echo "  git tag v$TAG && git push origin main v$TAG"
            exit 1
          fi
          echo "[OK] tag 与 package.json 版本一致: $PKG"

          if npm view "${NAME}@${PKG}" version >/dev/null 2>&1; then
            echo "::warning::${NAME}@${PKG} 已经发布过了，npm 不允许覆盖。"
            echo "若是重跑失败的任务，忽略此警告即可；若是新发版，说明版本号忘了升。"
          else
            echo "[OK] ${NAME}@${PKG} 尚未发布，可以继续"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Build successful!"

      - name: Run tests
        run: npm test

      # 自包含 skill 安装包（含 dist/ 与生产依赖），供 install.ps1 下载。
      # 必须在发版之前跑：打包失败就不该发版。
      - name: Pack skill bundle
        shell: pwsh
        run: ./scripts/pack-skill.ps1

      # 先发 Release。skill 安装包是主要分发渠道，不能因为 npm 那边出问题就一起没了
      # （步骤失败会跳过后续步骤——这正是之前「tag 推了却没有 Release」的一个潜在原因）。
      - name: Create GitHub Release and attach bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/zentao-skill.zip
            dist-release/zentao-skill.zip.sha256
          body: |
            ## 安装（推荐：skill 方式）

            一条命令完成下载 + 注册到 `~/.agents/skills/zentao` + 配置向导 + 连接自检。
            **无需注册 MCP server**，装好后任意项目目录都能用。

            ```powershell
            irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1 | iex
            ```

            重新配置凭据（升级 / 换账号）：

            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/jdfcc/zentao-mcp/main/install.ps1))) -Configure
            ```

            离线或内网安装：下载下面的 `zentao-skill.zip`，然后
            `./install.ps1 -LocalZip .\zentao-skill.zip`

            ## npm 方式

            ```bash
            npx @jdfcc/zentao-mcp
            ```

            ## 校验

            安装包的 SHA256 见 `zentao-skill.zip.sha256`。
          draft: false
          prerelease: false

      # npm 是次要渠道：没配 NPM_TOKEN 就跳过；即使配了而发布失败，也不连累上面的 Release。
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
